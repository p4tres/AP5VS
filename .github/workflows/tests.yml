name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - uloha: email-sender
            config: https://gitlab.com/ap5vs/test-config/email-sender-config/-/raw/main/test-config-1.yaml?ref_type=heads
          - uloha: telnet-client
            config: https://gitlab.com/ap5vs/test-config/telnet-client-config/-/raw/main/test-config-2.yaml?ref_type=heads

    defaults:
      run:
        working-directory: ${{ matrix.uloha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Run black box tests
        run: java -jar NATT.jar -nc "${{ matrix.config }}"

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.uloha }}
          path: ${{ matrix.uloha }}/test_report.html